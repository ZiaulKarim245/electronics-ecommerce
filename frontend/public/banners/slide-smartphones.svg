<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Background */}
  <rect width="1200" height="675" fill="url(#bgGlow)" />

  {/* Tech Cyber Grid Background Lines */}
  <g stroke="#0ea5e9" stroke-width="1" opacity="0.15">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  {/* Flagship Smartphones Vector Art (Right Side) */}
  <g transform="translate(680, 80)">
    {/* Secondary Phone (Angled Behind) */}
    <g transform="rotate(-15) translate(-40, 40)" opacity="0.7">
      <rect x="0" y="0" width="220" height="440" rx="36" fill="#0f172a" stroke="#475569" stroke-width="6" />
      <rect x="10" y="10" width="200" height="420" rx="28" fill="#1e1b4b" />
    </g>

    {/* Primary Hero Flagship Phone */}
    <g filter="url(#glow)">
      {/* Outer Titanium Frame */}
      <rect x="100" y="20" width="250" height="490" rx="42" fill="#020617" stroke="#38bdf8" stroke-width="6" />
      {/* Bezel */}
      <rect x="110" y="30" width="230" height="470" rx="34" fill="#0f172a" />
      {/* 120Hz Dynamic AMOLED Display */}
      <rect x="115" y="35" width="220" height="460" rx="30" fill="url(#screen)" />

      {/* Futuristic Clock Widget */}
      <text x="225" y="130" fill="#ffffff" font-size="44" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">12:45</text>
      <text x="225" y="160" fill="#e0f2fe" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3" font-family="system-ui, sans-serif">TECH FEST 2026</text>

      {/* Dynamic Island Pill */}
      <rect x="195" y="48" width="60" height="18" rx="9" fill="#020617" />
      <circle cx="242" cy="57" r="4" fill="#0369a1" />

      {/* Floating Spec Tags */}
      <g transform="translate(130, 240)">
        <rect x="0" y="0" width="190" height="40" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
        <text x="95" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">⚡ Snapdragon 8 Gen 3</text>
      </g>

      <g transform="translate(130, 295)">
        <rect x="0" y="0" width="190" height="40" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5" />
        <text x="95" y="25" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">📷 200MP Periscope OIS</text>
      </g>

      <g transform="translate(130, 350)">
        <rect x="0" y="0" width="190" height="40" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1.5" />
        <text x="95" y="25" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">🔋 5400mAh • 100W Fast</text>
      </g>
    </g>

    {/* Smartwatch Accent Art */}
    <g transform="translate(-80, 280)" filter="url(#glow)">
      {/* Strap */}
      <rect x="40" y="-30" width="40" height="180" rx="10" fill="#334155" />
      {/* Watch Case */}
      <circle cx="60" cy="60" r="48" fill="#020617" stroke="#38bdf8" stroke-width="4" />
      <circle cx="60" cy="60" r="42" fill="#0f172a" />
      <circle cx="60" cy="60" r="38" fill="#0369a1" fill-opacity="0.4" />
      <text x="60" y="58" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui">148</text>
      <text x="60" y="74" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui">BPM • AMOLED</text>
    </g>
  </g>
</svg>
